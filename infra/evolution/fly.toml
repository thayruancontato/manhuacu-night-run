app = 'mcu-nightrun-whatsapp'
primary_region = 'gru'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "evolution_instances"
  destination = "/evolution/instances"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
